<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101713">
<title>Task Timer</title>
<style>
:root{color-scheme:dark;--bg:#101713;--panel:#19231d;--muted:#9ca99f;--line:#2d3a31;--lime:#c7f36b;--white:#f4f7f2;--red:#ff8e7c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#293a2b 0%,var(--bg) 55%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);display:grid;place-items:center;padding:24px}.app{width:min(100%,440px)}.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.04em}.mark{width:30px;height:30px;border-radius:10px;background:var(--lime);color:#182017;display:grid;place-items:center;font-size:16px}.local{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{height:6px;width:6px;border-radius:50%;background:var(--lime)}.card{background:linear-gradient(150deg,#1d2921,#172019);border:1px solid #334138;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0006}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em}.task{width:100%;background:#111a14;border:1px solid var(--line);border-radius:12px;color:var(--white);padding:14px 15px;font:inherit;font-size:15px;margin-top:10px;outline:none}.task:focus{border-color:#90b84f}.task-head{display:flex;align-items:center;justify-content:space-between}.entry-end{display:flex;align-items:center;gap:8px;flex-shrink:0}.edit-entry{width:30px;height:30px;border:1px solid #36453a;border-radius:8px;background:#202c23;color:#c7f36b;font-size:15px;cursor:pointer}.edit-entry:hover{background:#2a392d}.clock{font-variant-numeric:tabular-nums;text-align:center;font-size:clamp(58px,15vw,78px);font-weight:650;letter-spacing:-.065em;line-height:1;margin:36px 0 10px}.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px}.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:26px}.btn{height:52px;border:0;border-radius:13px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:translateY(0)}.primary{background:var(--lime);color:#172015}.end{background:#26332a;color:#ffb3a6;border:1px solid #405044;padding:0 18px}.end:disabled{opacity:.42;cursor:not-allowed;transform:none}.hint{text-align:center;color:#829087;font-size:11px;margin:15px 0 0}.history{margin-top:23px}.history-head{display:flex;justify-content:space-between;align-items:center;margin:0 3px 10px}.history-head h2{font-size:13px;margin:0;font-weight:650}.total{font-size:11px;color:var(--muted)}.list{display:grid;gap:8px}.empty{border:1px dashed #344137;border-radius:13px;padding:17px;color:#91a095;text-align:center;font-size:12px}.entry{display:flex;justify-content:space-between;align-items:center;background:#172019;border:1px solid #2a372e;border-radius:12px;padding:12px 14px;gap:14px}.entry-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session-name-editor{width:100%;min-width:120px;background:#111a14;border:1px solid #90b84f;border-radius:7px;color:var(--white);padding:6px 8px;font:inherit;font-size:13px;outline:none}.entry-date{font-size:10px;color:var(--muted);margin-top:4px}.entry-time{font-size:13px;color:var(--lime);font-variant-numeric:tabular-nums;white-space:nowrap}.clear{background:none;border:0;color:#839087;font:inherit;font-size:10px;cursor:pointer;padding:5px}.clear:hover{color:var(--red)}footer{text-align:center;color:#718076;font-size:10px;margin-top:16px}@media(max-width:480px){body{padding:18px}.card{padding:23px 20px;border-radius:21px}.clock{margin-top:33px}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><span class="mark">◷</span> TASK TIMER</div><div class="local"><i class="dot"></i> Saved on this device</div></header>
<section class="card" aria-label="Task timer"><div class="task-head"><label class="eyebrow" for="task">What are you working on?</label></div><input id="task" class="task" maxlength="120" placeholder="Name your task" autocomplete="off"><div class="clock" id="clock" aria-live="off">00:00:00</div><div class="status" id="status">Ready when you are</div><div class="actions"><button class="btn primary" id="toggle">Start Timer</button><button class="btn end" id="finish" disabled>End</button></div><p class="hint">Your time is saved automatically if you refresh.</p></section>
<section class="history"><div class="history-head"><h2>Recent sessions</h2><span class="total" id="total"></span></div><div class="list" id="list"></div></section><footer>Simple time tracking. Everything stays in this browser.</footer></main>
<script>
(()=>{const KEY='focus-clock-v1';const $=id=>document.getElementById(id);let data={session:null,sessions:[]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.sessions)){data=saved;}}catch{}const task=$('task');task.value=data.session?.name||'';let tick;
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function elapsed(){const s=data.session;if(!s)return 0;return s.elapsed+(s.running?Math.max(0,Date.now()-s.startedAt):0)}
function fmt(ms){let sec=Math.floor(ms/1000);const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);sec%=60;return [h,m,sec].map(n=>String(n).padStart(2,'0')).join(':')}
function render(){const s=data.session;$('clock').textContent=fmt(elapsed());$('toggle').textContent=!s?'Start Timer':s.running?'Pause':'Resume';$('finish').disabled=!s;$('status').textContent=!s?'Ready when you are':s.running?'Timer running':`Paused · ${fmt(elapsed())}`;task.disabled=false;const list=$('list');if(list.querySelector('.session-name-editor')===document.activeElement)return;list.replaceChildren();$('total').textContent=data.sessions.length?`${data.sessions.length} ${data.sessions.length===1?'session':'sessions'}`:'';if(!data.sessions.length){const e=document.createElement('div');e.className='empty';e.textContent='Your finished sessions will show up here.';list.append(e);return}for(const item of data.sessions.slice(0,12)){const row=document.createElement('div');row.className='entry';const left=document.createElement('div');left.style.minWidth='0';const name=document.createElement('div');name.className='entry-name';name.textContent=item.name;const date=document.createElement('div');date.className='entry-date';date.textContent=new Date(item.endedAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});left.append(name,date);const time=document.createElement('div');time.className='entry-time';time.textContent=fmt(item.elapsed);const actions=document.createElement('div');actions.className='entry-end';actions.append(time);const edit=document.createElement('button');edit.className='edit-entry';edit.type='button';edit.textContent='✎';edit.title='Edit session name';edit.setAttribute('aria-label','Edit session name for '+item.name);edit.addEventListener('click',()=>{const field=document.createElement('input');field.className='session-name-editor';field.type='text';field.maxLength=120;field.value=item.name;field.setAttribute('aria-label','Edit task name');name.replaceChildren(field);field.focus();field.select();field.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();field.blur()}if(e.key==='Escape'){field.value=item.name;field.blur()}});field.addEventListener('blur',()=>{const clean=field.value.trim();if(clean)item.name=clean;save();render()},{once:true})});actions.append(edit);row.append(left,actions);list.append(row)}}
task.addEventListener('input',()=>{if(data.session&&task.value.trim()){data.session.name=task.value.trim();save()}});task.addEventListener('blur',()=>{if(data.session){const clean=task.value.trim();if(clean){data.session.name=clean;task.value=clean;save()}else task.value=data.session.name}});
$('toggle').addEventListener('click',()=>{if(!data.session){const name=task.value.trim();if(!name){task.focus();task.setCustomValidity('Add a task name to start your timer.');task.reportValidity();task.addEventListener('input',()=>task.setCustomValidity(''),{once:true});return}data.session={name,elapsed:0,startedAt:Date.now(),running:true}}else if(data.session.running){data.session.elapsed=elapsed();data.session.running=false}else{data.session.startedAt=Date.now();data.session.running=true}save();render()});
$('finish').addEventListener('click',()=>{if(!data.session)return;data.sessions.unshift({name:data.session.name,elapsed:elapsed(),endedAt:Date.now()});data.sessions=data.sessions.slice(0,50);data.session=null;save();render()});
window.addEventListener('beforeunload',save);render();tick=setInterval(render,250);
})();
</script></body></html>
